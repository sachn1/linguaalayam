name: Deploy to Cloud Run
# Primary deploy pipeline — build, run pending migrations, deploy. The
# Hetzner path (cd.yml) is now a manual-only rollback, not this.
#
# Required secrets: GCP_CD_WIF_PROVIDER, GCP_CD_SA (see
# terraform/outputs.tf: cd_workload_identity_provider, cd_service_account_email)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Bump Version"]
    types: [completed]

env:
  IMAGE: europe-west1-docker.pkg.dev/linguaalayam/linguaalayam/linguaalayam
  REGION: europe-west1
  PROJECT: linguaalayam

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Always checks out master's current tip, not a pinned SHA.
      # github.event.workflow_run.head_sha is frozen to whatever commit
      # *triggered* the Bump Version run — not the new version-bump commit
      # it creates and pushes during its own execution. Using that SHA here
      # deployed real app code correctly but with a permanently-stale
      # version string baked in (confirmed live: the deployed image reported
      # "2.12.3" via /openapi.json's info.version, a full release behind
      # what pyproject.toml said on master at the same moment). This
      # workflow's whole purpose is "deploy whatever's on master now" —
      # there's never a reason to pin to a historical SHA the way
      # terraform-plan.yml does for a specific PR.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_CD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CD_SA }}
          project_id: ${{ env.PROJECT }}

      - uses: google-github-actions/setup-gcloud@v2

      # data/geoip/GeoLite2-City.mmdb is gitignored (a 64MB third-party
      # MaxMind download, never committed — see .env.example) but the
      # Dockerfile COPYs it into the image. A fresh CI checkout never has
      # it on disk, so fetch it from the bucket it's stored in before
      # building, same path the manual local builds this session always
      # had it present for.
      - name: Fetch GeoIP database
        run: |
          mkdir -p data/geoip
          gsutil cp gs://linguaalayam-assets/geoip/GeoLite2-City.mmdb data/geoip/GeoLite2-City.mmdb

      # Builds via `docker buildx build --push` rather than `gcloud builds
      # submit` — the latter stages source in Cloud Build's auto-created GCS
      # bucket, which repeatedly rejected this WIF-federated identity with
      # an opaque "forbidden... serviceusage.services.use" error regardless
      # of which IAM roles were granted (tried three, plus an explicit
      # project_id — all produced the byte-identical error). This path
      # skips that bucket entirely: build locally in the runner, push
      # straight to Artifact Registry. Needs only artifactregistry.writer,
      # already granted.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: docker buildx build --push --tag "${{ env.IMAGE }}:latest" .

      - name: Run pending migrations
        run: gcloud run jobs execute linguaalayam-migrate --region="${{ env.REGION }}" --project="${{ env.PROJECT }}" --wait

      - name: Deploy
        run: |
          gcloud run deploy linguaalayam \
            --image="${{ env.IMAGE }}:latest" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT }}"
